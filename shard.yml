name: scaleway-api
version: 0.4.0

description: >
  Client Crystal pur (stdlib uniquement) pour l'API Scaleway REST v1.
  Couvre les endpoints nécessaires au provisioning Elastic Metal : clés
  SSH (IAM), serveurs bare-metal (offers, OS, create/install, update
  name+reverse, événements), zones DNS (records CNAME/A/AAAA, changesets
  idempotents). Zéro dépendance externe, authentification par jeton
  `X-Auth-Token`.

authors:
  - ALOLI sas <philippe@aloli.fr>

crystal: ">= 1.19.1"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
